name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "v${version}" = "$GITHUB_REF_NAME"
          fi
          test "$(uname -m)" = '${{ matrix.arch }}'
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          cargo test --locked
          sh scripts/build-release.sh --locked --offline
          test "$(lipo -archs target/release/larp)" = '${{ matrix.arch }}'
          codesign --force --sign - --timestamp=none target/release/larp
          codesign --verify --strict target/release/larp
          target/release/larp help | grep -F 'larp admin'
      - name: Package binary and documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          install -m 0755 target/release/larp dist/package/larp
          cp README.md QUICKSTART.md LICENSE dist/package/
          tar -czf "dist/larp-${GITHUB_REF_NAME}-darwin-${{ matrix.arch }}.tar.gz" \
            -C dist/package larp README.md QUICKSTART.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: larp-darwin-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: larp-darwin-*
          path: dist
          merge-multiple: true
      - name: Publish verified archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s "dist/larp-${GITHUB_REF_NAME}-darwin-arm64.tar.gz"
          test -s "dist/larp-${GITHUB_REF_NAME}-darwin-x86_64.tar.gz"
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "LARP ${GITHUB_REF_NAME#v}" --generate-notes
